spring:
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    consumer:
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.nurseli.notificationservice.application.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.nurseli.notificationservice.application.event.NotificationRequestedEvent
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      timeout: 3s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://integration-test/realms/test

management:
  tracing:
    sampling:
      probability: 0.0
  otlp:
    tracing:
      endpoint: http://localhost:65535/v1/traces

gmail:
  client-id: integration-test
  client-secret: integration-test
  refresh-token: integration-test
  from-address: integration@test.local

keycloak:
  auth-server-url: http://integration-test
  realm: test
  client-id: nrs-finance-backend
  client-secret: integration-test

finance:
  base-url: http://localhost:65535

notification:
  email:
    require-finance-email-verified: false
