databaseChangeLog:
  - changeSet:
      id: v3-email-delivery-audit
      author: nrs
      changes:
        - createTable:
            tableName: email_delivery_audit
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_email_delivery_audit
              - column:
                  name: target_sub
                  type: varchar(255)
              - column:
                  name: target_email
                  type: varchar(255)
              - column:
                  name: notification_type
                  type: varchar(64)
              - column:
                  name: status
                  type: varchar(32)
              - column:
                  name: failure_reason
                  type: text
              - column:
                  name: reference_type
                  type: varchar(64)
              - column:
                  name: reference_id
                  type: bigint
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: CURRENT_TIMESTAMP