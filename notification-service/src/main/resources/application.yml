spring:
  application:
    name: notification-service

  jackson:
    time-zone: Europe/Istanbul

  datasource:
    url: jdbc:postgresql://localhost:5432/nrs_finance?currentSchema=public
    username: nrs
    password: nrs123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/nrs-finance

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.nurseli.notificationservice.application.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.nurseli.notificationservice.application.event.NotificationRequestedEvent

server:
  port: 8089

# Actuator + Prometheus (local)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized

  tracing:
    sampling:
      probability: 1.0

# OTLP: local'de collector yoksa bu bloğu sil veya yoruma al
# otel:
#   exporter:
#     otlp:
#       endpoint: http://localhost:4317

logging:
  pattern:
    level: "%5p [trace=%X{trace_id:-}, span=%X{span_id:-}]"

gmail:
  client-id: ${GMAIL_CLIENT_ID:}
  client-secret: ${GMAIL_CLIENT_SECRET:}
  refresh-token: ${GMAIL_REFRESH_TOKEN:}
  from-address: ${GMAIL_FROM_ADDRESS:}

notification:
  email:
    require-finance-email-verified: ${NOTIFICATION_EMAIL_REQUIRE_FINANCE_VERIFIED:false}

keycloak:
  auth-server-url: http://localhost:8081
  realm: nrs-finance
  client-id: nrs-finance-backend
  client-secret: ${KEYCLOAK_NOTIFICATION_S2S_SECRET:}

finance:
  base-url: ${FINANCE_BASE_URL:http://localhost:8085}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha