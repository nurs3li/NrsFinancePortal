    backfill:
      enabled: ${INFLATION_BACKFILL_ENABLED:false}
      from: ${INFLATION_BACKFILL_FROM:2003-01-01}
      startup-enabled: ${INFLATION_BACKFILL_ON_STARTUP:false}
    cpi:
      persist-enabled: ${INFLATION_CPI_PERSIST_ENABLED:true}
      base-year: 2003
      scheduler-enabled: ${INFLATION_CPI_SCHEDULER_ENABLED:false}
      scheduler-cron: ${INFLATION_CPI_SCHEDULER_CRON:0 0 7 3 * *}
    ppi:
      persist-enabled: ${INFLATION_PPI_PERSIST_ENABLED:true}
      base-year: 2003
      scheduler-enabled: ${INFLATION_PPI_SCHEDULER_ENABLED:false}
      scheduler-cron: ${INFLATION_PPI_SCHEDULER_CRON:0 0 7 3 * *}
  deposit-rates:
    enabled: ${DEPOSIT_RATES_ENABLED:false}
    # WEEKLY — kredi faizi (haftalık akım) ile aynı frekans ailesi; EVDS ham verisi haftalık seri olarak işlenir.
    frequency: WEEKLY
    scheduler-enabled: ${DEPOSIT_RATES_SCHEDULER_ENABLED:false}
    scheduler-cron: ${DEPOSIT_RATES_SCHEDULER_CRON:0 0 7 * * MON}
