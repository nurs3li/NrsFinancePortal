server:
  port: 8083

spring:
  application:
    name: market-data-service
  jackson:
    time-zone: Europe/Istanbul
  datasource:
    url: jdbc:postgresql://nrs-postgres:5432/nrs_market
    username: nrs
    password: nrs123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: nrs-redis
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://nrs-keycloak:8080/realms/nrs-finance}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces

logging:
  pattern:
    level: "%5p [trace=%X{trace_id:-}, span=%X{span_id:-}]"

# Harici provider ayarlari (env-driven)
market:
  evds:
    enabled: true
    apiKey: ${EVDS_API_KEY:}
    timeoutMs: 3000
    debt:
      enabled: ${EVDS_DEBT_ENABLED:false}
      lookbackDays: ${EVDS_DEBT_LOOKBACK_DAYS:14}
      instruments:
        - isin: ${EVDS_DEBT_ISIN_1:TRT120228T10}
          name: ${EVDS_DEBT_NAME_1:TR Hazine Tahvili 2028}
          issuer: ${EVDS_DEBT_ISSUER_1:Hazine}
          maturityDate: ${EVDS_DEBT_MATURITY_1:2028-02-12}
          dirtyPriceSeries: ${EVDS_DEBT_DIRTY_PRICE_SERIES_1:}
          yieldSeries: ${EVDS_DEBT_YIELD_SERIES_1:}
        - isin: ${EVDS_DEBT_ISIN_2:TRT010531T16}
          name: ${EVDS_DEBT_NAME_2:TR Hazine Bonosu 2031}
          issuer: ${EVDS_DEBT_ISSUER_2:Hazine}
          maturityDate: ${EVDS_DEBT_MATURITY_2:2031-05-01}
          dirtyPriceSeries: ${EVDS_DEBT_DIRTY_PRICE_SERIES_2:}
          yieldSeries: ${EVDS_DEBT_YIELD_SERIES_2:}
  providers:
    viop:
      enabled: ${VIOP_PROVIDER_ENABLED:false}
      baseUrl: ${VIOP_PROVIDER_BASE_URL:}
      apiKey: ${VIOP_PROVIDER_API_KEY:}
      timeoutMs: 3000
      latestPath: ${VIOP_PROVIDER_LATEST_PATH:/viop/latest}
    debt:
      enabled: ${DEBT_PROVIDER_ENABLED:false}
      baseUrl: ${DEBT_PROVIDER_BASE_URL:}
      apiKey: ${DEBT_PROVIDER_API_KEY:}
      timeoutMs: 3000
      latestPath: ${DEBT_PROVIDER_LATEST_PATH:/debt/latest}

# Veri kaynağı yapılandırması
app:
  data-sources:
    tcmb:
      url: https://www.tcmb.gov.tr/kurlar/today.xml
    coingecko:
      url: https://api.coingecko.com/api/v3
    finhub:
      url: https://finnhub.io/api/v1
      api-key: ${FINHUB_API_KEY:your-api-key-here}
  equity:
    symbols:  # FinHub free plan: US only
      - AAPL
      - MSFT
      - GOOGL
      - AMZN
      - META
      - NVDA
      - TSLA
      - JPM
      - JNJ
      - V
      - WMT
  etf:
    symbols:
      - SPY
      - QQQ
      - VOO
      - VTI
      - IWM
      - GLD
      - VWO
      - EEM
  providers:
    fx:
      bank-proxy-evds-enabled: true
