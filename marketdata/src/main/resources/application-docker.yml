server:
  port: 8083

spring:
  application:
    name: market-data-service
  jackson:
    time-zone: Europe/Istanbul
  datasource:
    url: jdbc:postgresql://nrs-postgres:5432/nrs_market
    username: nrs
    password: nrs123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: nrs-redis
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://nrs-keycloak:8080/realms/nrs-finance}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces

logging:
  pattern:
    level: "%5p [trace=%X{trace_id:-}, span=%X{span_id:-}]"

# Harici provider ayarlari (env-driven)
market:
  stale-tail:
    enabled: ${MARKET_STALE_TAIL_ENABLED:true}
