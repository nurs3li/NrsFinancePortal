        # Kapalıyken yalnızca ilk /history isteğinde provider'a gidilir; kontrat çoksa grafik boş kalabilir.
        history-enabled: true
        snapshot-fixed-delay-ms: 3600000
        history-fixed-delay-ms: 3600000
        snapshot-initial-delay-ms: 120000
        history-initial-delay-ms: 1980000
        history-lookback-days: 7
        history-chunk-days: 7
        period-minutes: 60
        snapshot-cron: "0 */15 * * * *"
        history-cron: "0 30 2 * * *"
      whitelist:
        index:
