databaseChangeLog:
  - changeSet:
      id: v14-mph-bist-equity-daily-columns
      author: nurseli
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: market_price_history
        - not:
            columnExists:
              tableName: market_price_history
              columnName: adjusted_close
      changes:
        - addColumn:
            tableName: market_price_history
            columns:
              - column:
                  name: adjusted_close
                  type: NUMERIC(24,8)
              - column:
                  name: adjusted_average
                  type: NUMERIC(24,8)
              - column:
                  name: adjusted_low
                  type: NUMERIC(24,8)
              - column:
                  name: adjusted_high
                  type: NUMERIC(24,8)
              - column:
                  name: adjusted_volume
                  type: NUMERIC(24,8)
              - column:
                  name: raw_close
                  type: NUMERIC(24,8)
              - column:
                  name: raw_average
                  type: NUMERIC(24,8)
              - column:
                  name: raw_low
                  type: NUMERIC(24,8)
              - column:
                  name: raw_high
                  type: NUMERIC(24,8)
              - column:
                  name: raw_volume
                  type: NUMERIC(24,8)
              - column:
                  name: usd_try
                  type: NUMERIC(24,8)
              - column:
                  name: bist100_value
                  type: NUMERIC(24,8)
              - column:
                  name: usd_price
                  type: NUMERIC(24,8)
              - column:
                  name: index_based_price
                  type: NUMERIC(24,8)
              - column:
                  name: usd_volume
                  type: NUMERIC(24,8)
              - column:
                  name: capital
                  type: NUMERIC(24,2)
              - column:
                  name: market_cap_try
                  type: NUMERIC(24,2)
              - column:
                  name: market_cap_usd
                  type: NUMERIC(24,2)
              - column:
                  name: free_float_market_cap_try
                  type: NUMERIC(24,2)
              - column:
                  name: free_float_market_cap_usd
                  type: NUMERIC(24,2)
              - column:
                  name: dollar_based_low
                  type: NUMERIC(24,8)
              - column:
                  name: dollar_based_high
                  type: NUMERIC(24,8)
              - column:
                  name: dollar_based_average
                  type: NUMERIC(24,8)
              - column:
                  name: data_quality
                  type: VARCHAR(32)
              - column:
                  name: currency
                  type: VARCHAR(8)
