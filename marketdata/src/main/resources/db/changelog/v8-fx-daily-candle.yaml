databaseChangeLog:
  - changeSet:
      id: 008-create-fx-daily-candle
      author: nurseli
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: fx_daily_candle
      changes:
        - createTable:
            tableName: fx_daily_candle
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: symbol
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: as_of
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: open_price
                  type: NUMERIC(19,6)
                  constraints:
                    nullable: false
              - column:
                  name: high_price
                  type: NUMERIC(19,6)
                  constraints:
                    nullable: false
              - column:
                  name: low_price
                  type: NUMERIC(19,6)
                  constraints:
                    nullable: false
              - column:
                  name: close_price
                  type: NUMERIC(19,6)
                  constraints:
                    nullable: false
              - column:
                  name: volume
                  type: NUMERIC(24,6)
                  constraints:
                    nullable: true
              - column:
                  name: source
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: fx_daily_candle
            columnNames: symbol, as_of
            constraintName: uk_fx_daily_candle_symbol_as_of
        - createIndex:
            tableName: fx_daily_candle
            indexName: idx_fx_daily_candle_symbol_as_of
            columns:
              - column:
                  name: symbol
              - column:
                  name: as_of
