databaseChangeLog:
  - changeSet:
      id: v21-eurobond-instrument
      author: nrs-finance
      changes:
        - createTable:
            tableName: eurobond_instrument
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: isin
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: issuer
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
                  name: coupon_pct
                  type: NUMERIC(9, 4)
              - column:
                  name: maturity_date
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: evds_dirty_price_series
                  type: VARCHAR(96)
              - column:
                  name: evds_yield_series
                  type: VARCHAR(96)
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createTable:
            tableName: eurobond_price_snapshot
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: isin
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: as_of_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: clean_price
                  type: NUMERIC(19, 6)
                  constraints:
                    nullable: false
              - column:
                  name: yield_pct
                  type: NUMERIC(19, 6)
              - column:
                  name: source
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: eurobond_price_snapshot
            columnNames: isin, as_of_date
            constraintName: uk_eurobond_price_isin_date
        - createIndex:
            tableName: eurobond_price_snapshot
            indexName: idx_eurobond_price_isin_date
            columns:
              - column:
                  name: isin
              - column:
                  name: as_of_date
