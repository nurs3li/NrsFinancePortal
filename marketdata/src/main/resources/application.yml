    base-url: ${MARKET_EVDS_BASE_URL:https://evds3.tcmb.gov.tr/igmevdsms-dis}
    apiKey: ${EVDS_API_KEY:}
    timeoutMs: ${EVDS_TIMEOUT_MS:15000}
    # Mantıksal gösterge → EVDS seri kodu (Java içinde TP_* sabitlenmez).
