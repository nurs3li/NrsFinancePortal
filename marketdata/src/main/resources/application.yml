server:
  port: 8086

spring:
  application:
    name: market-data-service
  jackson:
    time-zone: Europe/Istanbul
  datasource:
    url: jdbc:postgresql://localhost:5432/nrs_market  # nrs_market yerine nrs_finance (docker-compose ile uyumlu)
    username: nrs
    password: nrs123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Veri kaynağı yapılandırması (FAZ 3.2)
app:
  data-sources:
    tcmb:
      url: https://www.tcmb.gov.tr/kurlar/today.xml
    coingecko:
      url: https://api.coingecko.com/api/v3
    finhub:
      url: https://finnhub.io/api/v1
      api-key: ${FINHUB_API_KEY:your-api-key-here}  # Environment variable'dan oku, yoksa default
  equity:
    symbols:  # FinHub free plan: US only
      - AAPL
      - MSFT
      - GOOGL
      - AMZN
      - META
      - NVDA
      - TSLA
      - JPM
      - JNJ
      - V
      - WMT
  etf:
    symbols: # FinHub free plan: US ETF (fon yerine)
      - SPY
      - QQQ
      - VOO
      - VTI
      - IWM
      - GLD
      - VWO
      - EEM    -
