server:
  port: 8086

spring:
  application:
    name: market-data-service
  # Repo kökündeki .env (EVDS_API_KEY vb.) IDE / mvn spring-boot:run için
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  jackson:
    time-zone: Europe/Istanbul
  datasource:
    url: jdbc:postgresql://localhost:5432/nrs_market  # nrs_market yerine nrs_finance (docker-compose ile uyumlu)
    username: nrs
    password: nrs123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/nrs-finance}

management:
  endpoints:
    web:
      exposure:
        include: health,info

market:
  stale-tail:
    enabled: true
    days: 3
  fx:
    effective-rates:
      lookback-days: ${MARKET_FX_EFFECTIVE_LOOKBACK_DAYS:${FX_EFFECTIVE_LOOKBACK_DAYS:400}}
  evds:
