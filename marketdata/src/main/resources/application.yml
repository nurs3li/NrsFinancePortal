server:
  port: 8086

spring:
  application:
    name: market-data-service
  jackson:
    time-zone: Europe/Istanbul
  datasource:
    url: jdbc:postgresql://localhost:5432/nrs_market  # nrs_market yerine nrs_finance (docker-compose ile uyumlu)
    username: nrs
    password: nrs123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/nrs-finance}

management:
  endpoints:
    web:
      exposure:
        include: health,info

market:
  evds:
    enabled: true
    apiKey: ${EVDS_API_KEY:}
    timeoutMs: 3000
    debt:
      enabled: ${EVDS_DEBT_ENABLED:false}
      lookbackDays: ${EVDS_DEBT_LOOKBACK_DAYS:14}
      instruments:
        - isin: ${EVDS_DEBT_ISIN_1:TRT120228T10}
          name: ${EVDS_DEBT_NAME_1:TR Hazine Tahvili 2028}
          issuer: ${EVDS_DEBT_ISSUER_1:Hazine}
          maturityDate: ${EVDS_DEBT_MATURITY_1:2028-02-12}
          dirtyPriceSeries: ${EVDS_DEBT_DIRTY_PRICE_SERIES_1:}
          yieldSeries: ${EVDS_DEBT_YIELD_SERIES_1:}
        - isin: ${EVDS_DEBT_ISIN_2:TRT010531T16}
          name: ${EVDS_DEBT_NAME_2:TR Hazine Bonosu 2031}
          issuer: ${EVDS_DEBT_ISSUER_2:Hazine}
          maturityDate: ${EVDS_DEBT_MATURITY_2:2031-05-01}
          dirtyPriceSeries: ${EVDS_DEBT_DIRTY_PRICE_SERIES_2:}
          yieldSeries: ${EVDS_DEBT_YIELD_SERIES_2:}
  providers:
    viop:
      enabled: false
      baseUrl: ${VIOP_PROVIDER_BASE_URL:}
      apiKey: ${VIOP_PROVIDER_API_KEY:}
      timeoutMs: 3000
      latestPath: /viop/latest
    debt:
      enabled: ${DEBT_PROVIDER_ENABLED:false}
      baseUrl: ${DEBT_PROVIDER_BASE_URL:}
      apiKey: ${DEBT_PROVIDER_API_KEY:}
      timeoutMs: 3000
      latestPath: ${DEBT_PROVIDER_LATEST_PATH:/debt/latest}


app:
  data-sources:
    tcmb:
      url: https://www.tcmb.gov.tr/kurlar/today.xml
    coingecko:
      url: https://api.coingecko.com/api/v3
    finhub:
      url: https://finnhub.io/api/v1
      api-key: ${FINHUB_API_KEY:your-api-key-here}  # Environment variable'dan oku, yoksa default
  equity:
    symbols:  # FinHub free plan: US only
      - AAPL
      - MSFT
      - GOOGL
      - AMZN
      - META
      - NVDA
      - TSLA
      - JPM
      - JNJ
      - V
      - WMT
  etf:
    symbols: # FinHub free plan: US ETF
      - SPY
      - QQQ
      - VOO
      - VTI
      - IWM
      - GLD
      - VWO
      - EEM
  market:
    fx:
      # TCMB ingest aralığı (ms). HTTP /doviz/latest canlı çekmez; DB + snapshot okur.
      scheduler-ms: 60000
      # Ingest sonrası bellek snapshot geçerlilik süresi (saniye)
      snapshot-ttl-seconds: 90
  providers:
    fx:
      canonical: TCMB
      fallback-order: [BANK, EVDS]
      # BANK provider ücretsiz ve güvenli degrade için EVDS proxy kullanabilir.
      # BANK canlı kaynak yoksa sistem boş map dönmek yerine EVDS ile devam eder.
      bank-proxy-evds-enabled: true
    fund:
      canonical: ETF
      fallback-order: []
    equity:
      canonical: FINHUB
      fallback-order: []
