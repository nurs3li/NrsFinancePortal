server:
  port: 8086

spring:
  application:
    name: market-data-service
  jackson:
    time-zone: Europe/Istanbul
  datasource:
    url: jdbc:postgresql://localhost:5432/nrs_market  # nrs_market yerine nrs_finance (docker-compose ile uyumlu)
    username: nrs
    password: nrs123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/nrs-finance}

management:
  endpoints:
    web:
      exposure:
        include: health,info

