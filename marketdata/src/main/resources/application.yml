app:
  internal:
    # Boşsa: POST /internal/market/backfill/bist-daily 401 (JWT admin ucu kullanılır).
    backfill-token: ${NRS_INTERNAL_BACKFILL_TOKEN:}
  translation:
    enabled: ${APP_TRANSLATION_ENABLED:true}
    provider: ${APP_TRANSLATION_PROVIDER:googlefree}
    base-url: ${APP_TRANSLATION_BASE_URL:http://localhost:5000}
    timeout-ms: ${APP_TRANSLATION_TIMEOUT_MS:2500}
    cache-max-entries: ${APP_TRANSLATION_CACHE_MAX:5000}
  data-sources:
    tcmb:
      url: https://www.tcmb.gov.tr/kurlar/today.xml
    coingecko:
      url: https://api.coingecko.com/api/v3
      api-key: ${COINGECKO_API_KEY:}
      connect-timeout-ms: 3000
      read-timeout-ms: 15000
    finhub:
      url: https://finnhub.io/api/v1
      api-key: ${FINHUB_API_KEY:your-api-key-here}  # Environment variable'dan oku, yoksa default
      candle-enabled: ${FINHUB_CANDLE_ENABLED:false}
    stooq:
      url: ${STOOQ_BASE_URL:https://stooq.com}
      api-key: ${STOOQ_API_KEY:}
    yahoo:
      url: ${YAHOO_BASE_URL:https://query1.finance.yahoo.com}
  equity:
    symbols:  # FinHub free plan: US only
      - AAPL
      - MSFT
      - GOOGL
      - AMZN
      - META
      - NVDA
      - TSLA
      - JPM
      - JNJ
      - V
      - WMT
    # Incremental'da son mumdan sonraki günden N gün geriye dış kaynak (Yahoo/Stooq) — ara boşluk doldurma
    incremental-gap-heal-days: ${EQUITY_INCREMENTAL_GAP_HEAL_DAYS:21}
    max-history-days: ${EQUITY_MAX_HISTORY_DAYS:730}
    history-incremental-cron: ${EQUITY_HISTORY_INCREMENTAL_CRON:0 30 2 * * *}
    history-incremental-zone: ${EQUITY_HISTORY_INCREMENTAL_ZONE:Europe/Istanbul}
    # Açılış: ihtiyaç varsa bir kez dış kaynakla geçmiş (Yahoo/Stooq/…); sonra incremental + quote rollup.
    initial-seed:
      enabled: ${EQUITY_INITIAL_SEED_ENABLED:true}
      min-candles: ${EQUITY_INITIAL_SEED_MIN_CANDLES:120}
      stale-days: ${EQUITY_INITIAL_SEED_STALE_DAYS:4}
    history-backfill:
      enabled: ${EQUITY_HISTORY_BACKFILL_ENABLED:false}
      periodDays: ${EQUITY_HISTORY_BACKFILL_PERIOD_DAYS:730}
      batchSize: ${EQUITY_HISTORY_BACKFILL_BATCH_SIZE:20}
      shutdownOnComplete: ${EQUITY_HISTORY_BACKFILL_SHUTDOWN_ON_COMPLETE:false}
  crypto:
    history-incremental-cron: ${CRYPTO_HISTORY_INCREMENTAL_CRON:0 45 2 * * *}
    history-backfill:
      enabled: ${CRYPTO_HISTORY_BACKFILL_ENABLED:false}
      periodDays: ${CRYPTO_HISTORY_BACKFILL_PERIOD_DAYS:365}
      shutdownOnComplete: ${CRYPTO_HISTORY_BACKFILL_SHUTDOWN_ON_COMPLETE:false}
      # Ücretsiz CoinGecko: coin başına bekleme; 429 alırsanız 8000–12000 deneyin
      delayMsBetweenCoins: ${CRYPTO_HISTORY_BACKFILL_DELAY_MS:4500}
      # Bu kadar günlük mum zaten DB'deyse OHLC çağrısı atlanır (0 = kapat)
      skipSymbolIfCandleCountAtLeast: ${CRYPTO_HISTORY_BACKFILL_SKIP_IF_COUNT:340}
  fx:
    history-backfill:
      enabled: ${FX_HISTORY_BACKFILL_ENABLED:false}
      periodDays: ${FX_HISTORY_BACKFILL_PERIOD_DAYS:730}
      shutdownOnComplete: ${FX_HISTORY_BACKFILL_SHUTDOWN_ON_COMPLETE:false}
  debt:
    history-backfill:
      enabled: ${DEBT_HISTORY_BACKFILL_ENABLED:false}
      periodDays: ${DEBT_HISTORY_BACKFILL_PERIOD_DAYS:730}
      shutdownOnComplete: ${DEBT_HISTORY_BACKFILL_SHUTDOWN_ON_COMPLETE:false}
  tefas:
    enabled: ${TEFAS_ENABLED:true}
    base-url: ${TEFAS_BASE_URL:https://www.tefas.gov.tr}
    fund-kind: ${TEFAS_FUND_KIND:YAT}
    # Yalnızca bu kodlar takip edilir; canlı 1000+ fon listesi çekilmez.
    symbols:
      # AAK/IIB TEFAS'ta yok (fonFiyatBilgiGetir boş döner) — geçerli kodlar:
      - AAS
      - TLY
      - GAH
      - AFT
      - IPJ
      - IIE
    backfill-on-startup: ${TEFAS_BACKFILL_ON_STARTUP:true}
    sync-profiles-on-startup: ${TEFAS_SYNC_PROFILES_ON_STARTUP:true}
    history-backfill-months: ${TEFAS_HISTORY_BACKFILL_MONTHS:12}
    min-history-rows-before-skip: ${TEFAS_MIN_HISTORY_ROWS:20}
    daily-cron: ${TEFAS_DAILY_CRON:0 35 7 * * *}
  etf:
    symbols: # FinHub free plan: US ETF
      - SPY
      - QQQ
      - VOO
      - VTI
      - IWM
      - GLD
      - VWO
      - EEM
    history-incremental-cron: ${ETF_HISTORY_INCREMENTAL_CRON:0 45 6 * * *}
    history-incremental-days: ${ETF_HISTORY_INCREMENTAL_DAYS:30}
  market:
    bank-rates:
      enabled: ${DOVIZBORSA_SCRAPER_ENABLED:true}
      url: ${DOVIZBORSA_BANK_RATES_URL:https://dovizborsa.com/banka/}
      cron: ${DOVIZBORSA_BANK_RATES_CRON:0 0 */2 * * *}
      zone: ${DOVIZBORSA_BANK_RATES_ZONE:Europe/Istanbul}
      stale-after-hours: ${DOVIZBORSA_BANK_RATES_STALE_HOURS:24}
      user-agent: ${DOVIZBORSA_USER_AGENT:NrsFinancePortal/1.0}
      connect-timeout-ms: ${DOVIZBORSA_CONNECT_TIMEOUT_MS:10000}
      read-timeout-ms: ${DOVIZBORSA_READ_TIMEOUT_MS:20000}
      scrape-on-startup: ${DOVIZBORSA_SCRAPE_ON_STARTUP:true}
      startup-delay-ms: ${DOVIZBORSA_STARTUP_DELAY_MS:240000}
      min-interval-between-scrapes-ms: ${DOVIZBORSA_MIN_SCRAPE_INTERVAL_MS:300000}
    fx:
      # TCMB ingest aralığı (ms). HTTP /doviz/latest canlı çekmez; DB + snapshot okur.
      scheduler-ms: 3600000
      # Ingest sonrası bellek snapshot geçerlilik süresi (saniye)
      snapshot-ttl-seconds: 90
    viop:
      enabled: true
      provider: IS_YATIRIM
      delay-minutes: 15
      default-period-minutes: 60
      cache-ttl-seconds: 900
      timezone: Europe/Istanbul
      isyatirim:
        base-url: https://www.isyatirim.com.tr
        history-path: /_Layouts/15/IsYatirim.Website/Common/ChartData.aspx/IndexHistoricalAll
        snapshot-path: /_layouts/15/Isyatirim.Website/Common/Data.aspx/OneEndeks
        referer: https://www.isyatirim.com.tr/tr-tr/analiz/Sayfalar/viop.aspx
        connect-timeout-ms: 5000
        read-timeout-ms: 10000
        user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/148.0.0.0 Safari/537.36
      scheduler:
        enabled: true
        snapshot-enabled: true
        history-enabled: true
        snapshot-fixed-delay-ms: 3600000
        history-fixed-delay-ms: 3600000
        snapshot-initial-delay-ms: 120000
        history-initial-delay-ms: 1980000
        history-lookback-days: 7
        history-chunk-days: 7
        period-minutes: 60
        # Geriye dönük YAML alanları (cron artık kullanılmıyor; fixed-delay öncelikli).
        snapshot-cron: "0 */15 * * * *"
        history-cron: "0 30 2 * * *"
      whitelist:
        index:
          - underlying: XU030
            display-name: BIST 30 Vadeli
