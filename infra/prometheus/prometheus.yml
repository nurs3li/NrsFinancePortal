global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "finance-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["finance-service:8080"]

  - job_name: "notification-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-service:8089"]

  - job_name: "market-data-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["market-data-service:8083"]

  - job_name: "log-consumer-service"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["log-consumer-service:8087"]

  # OTEL collector'ın Prometheus exporter'ı
  - job_name: "otel-collector"
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]