# https://grafana.com/docs/tempo/latest/configuration/
# TraceQL metrik sorguları (örn. Grafana Traces Drilldown: | rate() by(resource.service.name))
# için metrics_generator içinde local-blocks + traces_storage şarttır.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces

metrics_generator:
  # local-blocks işlemcisi için WAL; aksi halde: "local blocks processor requires traces wal"
  traces_storage:
    path: /tmp/tempo/generator/traces
  registry:
    collection_interval: 15s
    external_labels:
      source: tempo
  processor:
    local_blocks:
      # Drilldown metrikleri tüm span türlerini sayabilsin (sadece server span değil)
      filter_server_spans: false
    service_graphs:
      dimensions:
        - http.method
        - http.status_code
    span_metrics:
      dimensions:
        - http.method
        - http.status_code
  storage:
    path: /tmp/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks, service-graphs, span-metrics]
