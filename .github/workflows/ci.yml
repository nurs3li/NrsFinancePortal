# NrsFinancePortal — continuous integration
# PR / main push: backend tests (incl. Testcontainers), frontend, API contract gate, Docker smoke builds.

name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend · ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module:
          - finance-service
          - marketdata
          - notification-service
          - log-consumer-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Docker (Testcontainers)
        run: docker info

      - name: Run unit & integration tests
        working-directory: ${{ matrix.module }}
        run: bash ../mvnw -B test

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend · lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

  api-contract:
    name: API catalog & contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Endpoint contract coverage gate
        run: bash tools/endpoint_contract_gate.sh

      - name: Upload contract gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-contract-coverage
          path: artifacts/verification/ci-contract-gate/*
          if-no-files-found: warn
          retention-days: 14

  docker-smoke:
    name: Docker · image build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build finance-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: finance-service/Dockerfile
          push: false
          tags: nrs-finance-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build marketdata image
        uses: docker/build-push-action@v6
        with:
          context: marketdata
          file: marketdata/Dockerfile
          push: false
          tags: nrs-marketdata:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: nrs-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package JARs for runtime-only service images
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests -pl notification-service,log-consumer-service -am

      - name: Build notification-service image
        uses: docker/build-push-action@v6
        with:
          context: notification-service
          file: notification-service/Dockerfile
          push: false
          tags: nrs-notification-service:ci

      - name: Build log-consumer-service image
        uses: docker/build-push-action@v6
        with:
          context: log-consumer-service
          file: log-consumer-service/Dockerfile
          push: false
          tags: nrs-log-consumer-service:ci

  ci-success:
    name: CI · all checks passed
    runs-on: ubuntu-latest
    needs: [backend-test, frontend, api-contract, docker-smoke]
    if: always()
    steps:
      - name: Require all jobs green
        run: |
          test "${{ needs.backend-test.result }}" = "success" || exit 1
          test "${{ needs.frontend.result }}" = "success" || exit 1
          test "${{ needs.api-contract.result }}" = "success" || exit 1
          test "${{ needs.docker-smoke.result }}" = "success" || exit 1
