# NrsFinancePortal — continuous integration
# PR / main push: backend tests (incl. Testcontainers), frontend, Docker image build smoke.

name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend · ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        module:
          - finance-service
          - marketdata
          - notification-service
          - log-consumer-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify Docker (Testcontainers)
        run: docker info

      - name: Run unit & integration tests
        run: mvn -B test -pl ${{ matrix.module }} -am

      - name: Upload Surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend · lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build
        run: npm run build

  docker-smoke:
    name: Docker · image build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build finance-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: finance-service/Dockerfile
          push: false
          tags: nrs-finance-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build marketdata image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: marketdata/Dockerfile
          push: false
          tags: nrs-marketdata:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build notification-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: notification-service/Dockerfile
          push: false
          tags: nrs-notification-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build log-consumer-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: log-consumer-service/Dockerfile
          push: false
          tags: nrs-log-consumer-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: nrs-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
