name: api-contract-gate

on:
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  contract-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run finance-service tests
        run: |
          cd finance-service
          bash ../mvnw -q test

      - name: Run marketdata tests
        run: |
          cd marketdata
          bash ../mvnw -q test

      - name: Generate API catalog (static)
        run: bash tools/generate_api_catalog.sh

      - name: Check API catalog drift
        run: |
          git diff --exit-code docs/api/endpoints.md || (
            echo "::warning::docs/api/endpoints.md out of date — run: bash tools/generate_api_catalog.sh"
            exit 0
          )
        continue-on-error: true

      - name: Run endpoint contract coverage gate
        run: bash tools/endpoint_contract_gate.sh

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-contract-coverage
          path: artifacts/verification/ci-contract-gate/*
