spring:
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: localhost:65535
    listener:
      auto-startup: false
  task:
    scheduling:
      enabled: false
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://integration-test/realms/test

market-data:
  base-url: http://localhost:65535

app:
  rate-limit:
    enabled: false
  keycloak:
    admin:
      enabled: false
  observability:
    enabled: false
  price-alerts:
    enabled: true
