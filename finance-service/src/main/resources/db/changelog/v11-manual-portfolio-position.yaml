databaseChangeLog:
  - changeSet:
      id: v11-manual-portfolio-position
      author: nurseli
      changes:
        - createTable:
            tableName: manual_portfolio_positions
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: symbol
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: NUMERIC(38,8)
                  constraints:
                    nullable: false

              - column:
                  name: buy_price
                  type: NUMERIC(38,8)
                  constraints:
                    nullable: false

              - column:
                  name: buy_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: note
                  type: VARCHAR(500)

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: manual_portfolio_positions
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_manual_position_user

        - createIndex:
            tableName: manual_portfolio_positions
            indexName: idx_manual_position_user
            columns:
              - column:
                  name: user_id

        - createIndex:
            tableName: manual_portfolio_positions
            indexName: idx_manual_position_type_symbol
            columns:
              - column:
                  name: type
              - column:
                  name: symbol