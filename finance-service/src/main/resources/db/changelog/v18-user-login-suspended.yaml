databaseChangeLog:
  - changeSet:
      id: v18-user-login-suspended
      author: nrsfinanceportal
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: login_suspended
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: login_suspended_at
                  type: timestamp with time zone
              - column:
                  name: login_suspended_reason
                  type: varchar(500)
