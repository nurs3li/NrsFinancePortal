databaseChangeLog:
  - changeSet:
      id: v15-user-starred-assets
      author: nurseli
      changes:
        - createTable:
            tableName: user_starred_asset
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_starred_asset
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: market_type
                  type: VARCHAR(24)
                  constraints:
                    nullable: false
              - column:
                  name: symbol
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: position
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: user_starred_asset
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_starred_asset_user
            onDelete: CASCADE

        - addUniqueConstraint:
            tableName: user_starred_asset
            columnNames: user_id, market_type, symbol
            constraintName: uq_user_starred_asset_user_symbol_type

        - addUniqueConstraint:
            tableName: user_starred_asset
            columnNames: user_id, position
            constraintName: uq_user_starred_asset_user_position

        - createIndex:
            tableName: user_starred_asset
            indexName: idx_user_starred_asset_user
            columns:
              - column:
                  name: user_id
