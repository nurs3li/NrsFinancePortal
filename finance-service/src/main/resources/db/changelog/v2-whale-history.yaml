databaseChangeLog:
  - changeSet:
      id: v2-whale-history
      author: nurseli
      changes:

        - createTable:
            tableName: whale_history
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: whale_level
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: reason
                  type: TEXT

              - column:
                  name: triggered_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

        - createIndex:
            tableName: whale_history
            indexName: idx_whale_history_user_triggered
            columns:
              - column:
                  name: user_id
              - column:
                  name: triggered_at
                  descending: true