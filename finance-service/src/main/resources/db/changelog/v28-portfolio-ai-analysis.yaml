databaseChangeLog:
  - changeSet:
      id: v28-portfolio-ai-analysis
      author: nurseli
      changes:
        - createTable:
            tableName: portfolio_ai_analysis
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_portfolio_ai_analysis
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: analysis_type
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: risk_profile
                  type: VARCHAR(16)
              - column:
                  name: detail_level
                  type: VARCHAR(16)
              - column:
                  name: portfolio_snapshot_json
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: ai_output_json
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: portfolio_score
                  type: INT
              - column:
                  name: risk_score
                  type: INT
              - column:
                  name: confidence
                  type: VARCHAR(16)
              - column:
                  name: concentration_risk
                  type: VARCHAR(16)
              - column:
                  name: request_hash
                  type: VARCHAR(64)
              - column:
                  name: model
                  type: VARCHAR(64)
              - column:
                  name: prompt_version
                  type: VARCHAR(32)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_portfolio_ai_user_created
            tableName: portfolio_ai_analysis
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at
                  descending: true
        - createIndex:
            indexName: idx_portfolio_ai_user_hash
            tableName: portfolio_ai_analysis
            columns:
              - column:
                  name: user_id
              - column:
                  name: request_hash
        - createIndex:
            indexName: idx_portfolio_ai_user_type
            tableName: portfolio_ai_analysis
            columns:
              - column:
                  name: user_id
              - column:
                  name: analysis_type
        - addForeignKeyConstraint:
            baseTableName: portfolio_ai_analysis
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_portfolio_ai_user
            onDelete: CASCADE
