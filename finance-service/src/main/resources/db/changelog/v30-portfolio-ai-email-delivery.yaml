databaseChangeLog:
  - changeSet:
      id: v30-portfolio-ai-email-delivery
      author: nurseli
      changes:
        - createTable:
            tableName: portfolio_ai_email_delivery
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_portfolio_ai_email_delivery
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: frequency
                  type: VARCHAR(16)
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: portfolio_ai_email_delivery
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_portfolio_ai_email_delivery_user
