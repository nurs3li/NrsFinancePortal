databaseChangeLog:
  - changeSet:
      id: v7-suspicious-events
      author: nurseli
      changes:

        - createTable:
            tableName: suspicious_events
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: transaction_id
                  type: BIGINT

              - column:
                  name: reason
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: amount
                  type: NUMERIC(30,10)

              - column:
                  name: count_in_window
                  type: BIGINT

              - column:
                  name: threshold_amount
                  type: NUMERIC(30,10)

              - column:
                  name: threshold_count
                  type: INT

              - column:
                  name: occurred_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false

        - createIndex:
            tableName: suspicious_events
            indexName: idx_suspicious_events_user_occurred
            columns:
              - column:
                  name: user_id
              - column:
                  name: occurred_at
                  descending: true