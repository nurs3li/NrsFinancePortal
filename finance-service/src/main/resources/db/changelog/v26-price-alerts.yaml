databaseChangeLog:
  - changeSet:
      id: v26-price-alerts
      author: nurseli
      changes:
        - createTable:
            tableName: price_alert
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_price_alert
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: asset_type
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: symbol
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: condition_type
                  type: VARCHAR(24)
                  constraints:
                    nullable: false
              - column:
                  name: threshold
                  type: DECIMAL(20, 8)
                  constraints:
                    nullable: false
              - column:
                  name: change_window
                  type: VARCHAR(16)
              - column:
                  name: channels
                  type: VARCHAR(16)
                  defaultValue: BOTH
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: repeat_alert
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: cooldown_hours
                  type: INT
                  defaultValueNumeric: 24
                  constraints:
                    nullable: false
              - column:
                  name: last_triggered_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: price_alert
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_price_alert_user
            onDelete: CASCADE

        - createIndex:
            tableName: price_alert
            indexName: idx_price_alert_status
            columns:
              - column:
                  name: status

        - createIndex:
            tableName: price_alert
            indexName: idx_price_alert_user_status
            columns:
              - column:
                  name: user_id
              - column:
                  name: status
