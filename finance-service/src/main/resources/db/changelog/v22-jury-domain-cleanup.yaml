databaseChangeLog:
  # Jüri geri bildirimi: gerçek para/bakiye, trade execution, FM onayı, şüpheli işlem
  # ve hesap dondurma domain'i kaldırılır. Portföy snapshot tablosu sadeleştirilir.
  - changeSet:
      id: v22-drop-operational-domain
      author: nrsfinance
      changes:
        - dropTable:
            tableName: suspicious_events
        - dropTable:
            tableName: fund_requests
        - dropTable:
            tableName: review_tasks
        - dropTable:
            tableName: trade
        - dropTable:
            tableName: portfolio_value_snapshots
        - dropForeignKeyConstraint:
            baseTableName: transactions
            constraintName: fk_transactions_reversal
        - dropTable:
            tableName: transactions
        - dropTable:
            tableName: balances
        - dropTable:
            tableName: portfolio_assets
        - dropTable:
            tableName: whale_history
        - dropTable:
            tableName: accounts

        - dropColumn:
            tableName: users
            columnName: login_suspended
        - dropColumn:
            tableName: users
            columnName: login_suspended_at
        - dropColumn:
            tableName: users
            columnName: login_suspended_reason
        - dropColumn:
            tableName: users
            columnName: is_whale
        - dropColumn:
            tableName: users
            columnName: whale_level
        - dropColumn:
            tableName: users
            columnName: whale_since

        - createTable:
            tableName: portfolio_value_snapshots
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: snapshot_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
              - column:
                  name: trigger_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: portfolio_value_try
                  type: DECIMAL(38, 8)
                  constraints:
                    nullable: false
              - column:
                  name: portfolio_cost_try
                  type: DECIMAL(38, 8)
                  constraints:
                    nullable: false
              - column:
                  name: portfolio_pnl_try
                  type: DECIMAL(38, 8)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: portfolio_value_snapshots
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_pvs_user
        - createIndex:
            tableName: portfolio_value_snapshots
            indexName: idx_pvs_user_snapshot
            columns:
              - column:
                  name: user_id
              - column:
                  name: snapshot_at
        - createIndex:
            tableName: portfolio_value_snapshots
            indexName: idx_pvs_user_trigger_time
            columns:
              - column:
                  name: user_id
              - column:
                  name: trigger_type
              - column:
                  name: snapshot_at
