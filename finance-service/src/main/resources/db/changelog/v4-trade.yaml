databaseChangeLog:
  - changeSet:
      id: 002-create-trade-table
      author: nurseli
      changes:

        - createTable:
            tableName: trade
            columns:

              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: trade_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: asset_type
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: symbol
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: quantity
                  type: NUMERIC(19, 8)
                  constraints:
                    nullable: false

              - column:
                  name: transaction_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: trade
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_trade_user

        - addForeignKeyConstraint:
            baseTableName: trade
            baseColumnNames: transaction_id
            referencedTableName: transactions
            referencedColumnNames: id
            constraintName: fk_trade_transaction
