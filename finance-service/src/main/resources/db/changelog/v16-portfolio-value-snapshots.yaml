databaseChangeLog:
  - changeSet:
      id: v16-portfolio-value-snapshots
      author: nrsfinance
      changes:
        - createTable:
            tableName: portfolio_value_snapshots
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: snapshot_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: trigger_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: trade_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: combined_value_try
                  type: DECIMAL(38, 8)
                  constraints:
                    nullable: false
              - column:
                  name: combined_cost_try
                  type: DECIMAL(38, 8)
                  constraints:
                    nullable: false
              - column:
                  name: combined_pnl_try
                  type: DECIMAL(38, 8)
                  constraints:
                    nullable: false
              - column:
                  name: trade_value_try
                  type: DECIMAL(38, 8)
                  constraints:
                    nullable: false
              - column:
                  name: trade_cost_try
                  type: DECIMAL(38, 8)
                  constraints:
                    nullable: false
              - column:
                  name: trade_pnl_try
                  type: DECIMAL(38, 8)
                  constraints:
                    nullable: false
              - column:
                  name: manual_value_try
                  type: DECIMAL(38, 8)
                  constraints:
                    nullable: false
              - column:
                  name: manual_cost_try
                  type: DECIMAL(38, 8)
                  constraints:
                    nullable: false
              - column:
                  name: manual_pnl_try
                  type: DECIMAL(38, 8)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: portfolio_value_snapshots
            indexName: idx_pvs_user_snapshot
            columns:
              - column:
                  name: user_id
              - column:
                  name: snapshot_at
        - createIndex:
            tableName: portfolio_value_snapshots
            indexName: idx_pvs_user_trigger_time
            columns:
              - column:
                  name: user_id
              - column:
                  name: trigger_type
              - column:
                  name: snapshot_at
        - addForeignKeyConstraint:
            baseTableName: portfolio_value_snapshots
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_pvs_user
