server:
  port: 8080

spring:
  application:
    name: finance-service

  jackson:
    time-zone: Europe/Istanbul

  kafka:
    bootstrap-servers: nrs-kafka:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: finance-whale-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringSerializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

  datasource:
    url: jdbc:postgresql://nrs-postgres:5432/nrs_finance
    username: nrs
    password: nrs123
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: nrs-redis
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          # Docker'da custom JwtDecoder kullanıyoruz, auto-config'i disable et
          issuer-uri: null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces

logging:
  pattern:
    level: "%5p [trace=%X{trace_id:-}, span=%X{span_id:-}]"

market-data:
  base-url: http://nrs-market-data:8083
  connect-timeout-ms: 5000
  response-timeout-ms: 20000

app:
  trade:
    order-form-v2-enabled: true
  rate-limit:
    enabled: true
    max-requests-per-minute: 40
    window-sec: 60
  suspicious:
    enabled: true
    max-transactions-per-minute: 8
    high-amount-threshold: 40000
  fund-request:
    auto-approval-enabled: true
    deposit-auto-approve-limit-try: 50000
    withdrawal-auto-approve-limit-try: 3000
    require-receipt-for-deposit: true
    require-reference-no-for-deposit: true
    require-iban-for-deposit: true
  keycloak:
    admin:
      enabled: ${KEYCLOAK_ADMIN_ENABLED:false}
      server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://nrs-keycloak:8080}
      realm: ${KEYCLOAK_ADMIN_REALM:nrs-finance}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}