server:
  port: 8080

spring:
  application:
    name: finance-service

  jackson:
    time-zone: Europe/Istanbul

  kafka:
    bootstrap-servers: nrs-kafka:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: finance-whale-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringSerializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

  datasource:
    url: jdbc:postgresql://nrs-postgres:5432/nrs_finance
    username: nrs
    password: nrs123
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: nrs-redis
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          # Docker'da custom JwtDecoder kullanıyoruz, auto-config'i disable et
          issuer-uri: null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces

logging:
  pattern:
    level: "%5p [trace=%X{trace_id:-}, span=%X{span_id:-}]"

market-data:
  base-url: http://nrs-market-data:8083

app:
  rate-limit:
    enabled: true
    max-requests-per-minute: 20
    window-sec: 60
  suspicious:
    enabled: true
    max-transactions-per-minute: 1
    high-amount-threshold: 100