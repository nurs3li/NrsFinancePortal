server:
  port: 8080

spring:
  application:
    name: finance-service

  mvc:
    async:
      request-timeout: 31m

  jackson:
    time-zone: Europe/Istanbul

  kafka:
    bootstrap-servers: nrs-kafka:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: finance-whale-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringSerializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

  datasource:
    url: jdbc:postgresql://nrs-postgres:5432/nrs_finance
    username: nrs
    password: nrs123
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    redis:
      host: nrs-redis
      port: 6379

  security:
    oauth2:
      resourceserver:
        jwt:
          # Docker'da custom JwtDecoder kullanıyoruz, auto-config'i disable et
          issuer-uri: null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces

logging:
  pattern:
    level: "%5p [trace=%X{trace_id:-}, span=%X{span_id:-}]"

market-data:
  base-url: http://nrs-market-data:8083
  connect-timeout-ms: 5000
  response-timeout-ms: 20000

app:
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://nrs-notification:8089}
  trade:
    order-form-v2-enabled: true
  rate-limit:
    enabled: true
    max-requests-per-minute: 40
    window-sec: 60
  suspicious:
    enabled: true
    max-transactions-per-minute: 8
    high-amount-threshold: 40000
  fund-request:
    auto-approval-enabled: true
    deposit-auto-approve-limit-try: 50000
    withdrawal-auto-approve-limit-try: 3000
    require-iban-for-deposit: true
  receipt-storage:
    root: ${NRS_RECEIPT_STORAGE_ROOT:/data/receipts}
  keycloak:
    admin:
      enabled: ${KEYCLOAK_ADMIN_ENABLED:false}
      server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://nrs-keycloak:8080}
      realm: ${KEYCLOAK_ADMIN_REALM:nrs-finance}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    security:
      otp-enforcement-enabled: ${KEYCLOAK_SECURITY_OTP_ENFORCEMENT_ENABLED:false}
      # Docker: .env'de true yapın veya docker-compose varsayılanına güvenin (env satırı yoksa açık)
      remember-me-enforcement-enabled: ${KEYCLOAK_SECURITY_REMEMBER_ME_ENFORCEMENT_ENABLED:true}
      enforced-roles: ${KEYCLOAK_SECURITY_ENFORCED_ROLES:ADMIN,FINANCE_MANAGER}
      required-action: ${KEYCLOAK_SECURITY_REQUIRED_ACTION:CONFIGURE_TOTP}
      remember-me: ${KEYCLOAK_SECURITY_REMEMBER_ME:true}
      sso-idle: ${KEYCLOAK_SECURITY_SSO_IDLE:PT30M}
      sso-max: ${KEYCLOAK_SECURITY_SSO_MAX:PT8H}
      access-token-lifespan: ${KEYCLOAK_SECURITY_ACCESS_TOKEN_LIFESPAN:PT5M}
      client-session-idle: ${KEYCLOAK_SECURITY_CLIENT_SESSION_IDLE:PT30M}
      client-session-max: ${KEYCLOAK_SECURITY_CLIENT_SESSION_MAX:PT8H}
      reconcile-cron: ${KEYCLOAK_SECURITY_RECONCILE_CRON:0 0 */6 * * *}
  observability:
    enabled: ${APP_OBSERVABILITY_ENABLED:true}
    open-search:
      base-url: ${APP_OBSERVABILITY_OPENSEARCH_BASE_URL:http://nrs-opensearch:9200}
      index-pattern: application-logs-*
      request-timeout-ms: 15000
    tempo:
      base-url: ${APP_OBSERVABILITY_TEMPO_BASE_URL:http://nrs-tempo:3200}
      request-timeout-ms: 12000
    grafana:
      public-base-url: ${APP_OBSERVABILITY_GRAFANA_PUBLIC_BASE_URL:http://localhost:3001}
      org-id: ${APP_OBSERVABILITY_GRAFANA_ORG_ID:1}
      tempo-datasource-uid: ${APP_OBSERVABILITY_GRAFANA_TEMPO_UID:nrs-tempo}