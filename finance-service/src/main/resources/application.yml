spring:
  application:
    name: finance-service

  mvc:
    async:
      request-timeout: 31m

  jackson:
    time-zone: Europe/Istanbul

  datasource:
    url: jdbc:postgresql://localhost:5432/nrs_finance
    username: nrs
    password: nrs123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/nrs-finance

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        spring.json.use.type.headers: false

market-data:
  base-url: http://localhost:8083
  connect-timeout-ms: 5000
  response-timeout-ms: 20000

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}
  temperature: ${OPENAI_TEMPERATURE:0.2}
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:60}

portfolio-ai:
  # 0 = sınırsız; >0 ise yalnızca başarılı OpenAI analizi kotaya sayılır (fallback sayılmaz)
  daily-limit: ${PORTFOLIO_AI_DAILY_LIMIT:1}
  prompt-version: v2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
app:
  observability:
    enabled: ${APP_OBSERVABILITY_ENABLED:true}
    open-search:
      base-url: ${APP_OBSERVABILITY_OPENSEARCH_BASE_URL:http://localhost:9200}
      index-pattern: application-logs-*
      request-timeout-ms: 15000
    tempo:
      base-url: ${APP_OBSERVABILITY_TEMPO_BASE_URL:http://localhost:3200}
      request-timeout-ms: 12000
    grafana:
      public-base-url: ${APP_OBSERVABILITY_GRAFANA_PUBLIC_BASE_URL:http://localhost:3001}
      org-id: ${APP_OBSERVABILITY_GRAFANA_ORG_ID:1}
      tempo-datasource-uid: ${APP_OBSERVABILITY_GRAFANA_TEMPO_UID:nrs-tempo}
  notification:
    base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8089}
  rate-limit:
    enabled: true
    max-requests-per-minute: 40
    window-sec: 60
  manual-portfolio:
    price-resolve:
      max-lookback-days: 7
  price-alerts:
    enabled: ${APP_PRICE_ALERTS_ENABLED:true}
    evaluation-cron: ${APP_PRICE_ALERTS_CRON:0 */2 * * * *}
    max-active-per-user: ${APP_PRICE_ALERTS_MAX_ACTIVE:30}
  # Dekont dosyaları. Boşsa: ${user.home}/.nrs-finance/receipts. Docker: /data/receipts + volume önerilir (tmp silinmez).
  receipt-storage:
    root: ${NRS_RECEIPT_STORAGE_ROOT:}
  keycloak:
    admin:
      enabled: ${KEYCLOAK_ADMIN_ENABLED:false}
      server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8081}
      realm: ${KEYCLOAK_ADMIN_REALM:nrs-finance}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    password-grant:
      client-id: ${KEYCLOAK_PASSWORD_GRANT_CLIENT_ID:nrs-frontend}
      client-secret: ${KEYCLOAK_PASSWORD_GRANT_CLIENT_SECRET:}
    security:
      otp-enforcement-enabled: ${KEYCLOAK_SECURITY_OTP_ENFORCEMENT_ENABLED:false}
      # Realm rememberMe + oturum süreleri otomasyonu. Keycloak: Realm settings → Login → Remember me = ON
      remember-me-enforcement-enabled: ${KEYCLOAK_SECURITY_REMEMBER_ME_ENFORCEMENT_ENABLED:false}
      enforced-roles: ${KEYCLOAK_SECURITY_ENFORCED_ROLES:ADMIN}
      required-action: ${KEYCLOAK_SECURITY_REQUIRED_ACTION:CONFIGURE_TOTP}
      remember-me: ${KEYCLOAK_SECURITY_REMEMBER_ME:true}
      sso-idle: ${KEYCLOAK_SECURITY_SSO_IDLE:PT30M}
      sso-max: ${KEYCLOAK_SECURITY_SSO_MAX:PT8H}
      access-token-lifespan: ${KEYCLOAK_SECURITY_ACCESS_TOKEN_LIFESPAN:PT5M}
      client-session-idle: ${KEYCLOAK_SECURITY_CLIENT_SESSION_IDLE:PT30M}
      client-session-max: ${KEYCLOAK_SECURITY_CLIENT_SESSION_MAX:PT8H}
      reconcile-cron: ${KEYCLOAK_SECURITY_RECONCILE_CRON:0 0 */6 * * *}