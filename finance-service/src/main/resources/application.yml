spring:
  application:
    name: finance-service

  jackson:
    time-zone: Europe/Istanbul

  datasource:
    url: jdbc:postgresql://localhost:5432/nrs_finance
    username: nrs
    password: nrs123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/nrs-finance

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        spring.json.use.type.headers: false
    consumer:
      group-id: finance-whale-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.nurseli.nrsfinanceportal.integration.kafka.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.nurseli.nrsfinanceportal.integration.kafka.event.WhaleAlertTriggeredEvent

market-data:
  base-url: http://localhost:8083
  connect-timeout-ms: 5000
  response-timeout-ms: 20000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
app:
  rate-limit:
    enabled: true
    max-requests-per-minute: 20
    window-sec: 60
  suspicious:
    enabled: true
    max-transactions-per-minute: 1
    high-amount-threshold: 100
  fund-request:
    auto-approval-enabled: true
    deposit-auto-approve-limit-try: 50000
    withdrawal-auto-approve-limit-try: 3000
    require-receipt-for-deposit: true
    require-reference-no-for-deposit: true
    require-iban-for-deposit: true