spring:
  application:
    name: finance-service

  datasource:
    url: jdbc:postgresql://localhost:5432/nrs_finance
    username: nrs
    password: nrs123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # dev için OK, prod'da migration
    show-sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/nrs-finance

  kafka:
    bootstrap-servers: localhost:9092

    # 🔹 PRODUCER (TransactionCreatedEvent vs.)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
        spring.json.use.type.headers: false

    # 🔹 CONSUMER (WhaleAlertTriggeredEvent)
    consumer:
      group-id: finance-whale-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.nurseli.nrsfinanceportal.integration.kafka.event
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.nurseli.nrsfinanceportal.integration.kafka.event.WhaleAlertTriggeredEvent
