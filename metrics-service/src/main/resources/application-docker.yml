spring:
  application:
    name: metrics-service

  jackson:
    time-zone: Europe/Istanbul

  kafka:
    bootstrap-servers: nrs-kafka:9093
    consumer:
      group-id: metrics-consumer
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  data:
    redis:
      host: nrs-redis
      port: 6379

server:
  port: 8088

opensearch:
  host: nrs-opensearch
  port: 9200

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces

logging:
  pattern:
    level: "%5p [trace=%X{trace_id:-}, span=%X{span_id:-}]"

app:
  kafka:
    legacy-finance-ingestion-enabled: false
    topics:
      investor-behavior-updated: ${KAFKA_TOPIC_INVESTOR_BEHAVIOR_UPDATED:investor.behavior.updated}
  whale:
    legacy-transaction-analysis-enabled: false
  metrics:
    investor-behavior-indexing-enabled: true
