spring:
  application:
    name: metrics-service

  jackson:
    time-zone: Europe/Istanbul

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: metrics-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8084

opensearch:
  host: localhost
  port: 9200

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

# Eski whale/trade tüketimi: app.whale.legacy-transaction-analysis-enabled veya app.kafka.legacy-finance-ingestion-enabled
app:
  kafka:
    legacy-finance-ingestion-enabled: false
    topics:
      investor-behavior-updated: ${KAFKA_TOPIC_INVESTOR_BEHAVIOR_UPDATED:investor.behavior.updated}
  whale:
    legacy-transaction-analysis-enabled: false
  metrics:
    investor-behavior-indexing-enabled: true



