server:
  port: 8082

spring:
  application:
    name: whale-analytics-service

  jackson:
    time-zone: Europe/Istanbul

  kafka:
    bootstrap-servers: nrs-kafka:9093   # 🔥 BURASI
    consumer:
      group-id: whale-detector
      auto-offset-reset: latest
      enable-auto-commit: false

  data:
    redis:
      host: nrs-redis
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces

logging:
  pattern:
    level: "%5p [trace=%X{trace_id:-}, span=%X{span_id:-}]"

whale:
  thresholds:
    l1:
      single-tx: 250
      daily-volume: 1000000
      hourly-count: 1
    l2:
      single-tx: 500000
      daily-volume: 5000000
      hourly-count: 20
    l3:
      single-tx: 1000000
      daily-volume: 20000000
      hourly-count: 50

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
