      DEBT_PROVIDER_LATEST_PATH: ${DEBT_PROVIDER_LATEST_PATH:-/debt/latest}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://nrs-keycloak:8080/realms/nrs-finance}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  finance-service:
    build:
      context: .
      dockerfile: finance-service/Dockerfile
    container_name: nrs-finance
    ports:
      - "8085:8080"
    depends_on:
      keycloak:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
      market-data-service:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://nrs-postgres:5432/nrs_finance
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
      SPRING_DATA_REDIS_HOST: nrs-redis
      MARKET_DATA_SERVICE_URL: http://nrs-market-data:8083
      KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      KEYCLOAK_ADMIN_ENABLED: ${KEYCLOAK_ADMIN_ENABLED:-false}
      KEYCLOAK_ADMIN_SERVER_URL: ${KEYCLOAK_ADMIN_SERVER_URL:-http://nrs-keycloak:8080}
      KEYCLOAK_ADMIN_REALM: ${KEYCLOAK_ADMIN_REALM:-nrs-finance}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      KEYCLOAK_SECURITY_OTP_ENFORCEMENT_ENABLED: ${KEYCLOAK_SECURITY_OTP_ENFORCEMENT_ENABLED:-false}
      # Remember me realm senkronu (SSO süreleri + rememberMe bayrağı). .env'de false yazarsanız kapanır.
      KEYCLOAK_SECURITY_REMEMBER_ME_ENFORCEMENT_ENABLED: ${KEYCLOAK_SECURITY_REMEMBER_ME_ENFORCEMENT_ENABLED:-true}
      KEYCLOAK_SECURITY_ENFORCED_ROLES: ${KEYCLOAK_SECURITY_ENFORCED_ROLES:-ADMIN}
      KEYCLOAK_SECURITY_REQUIRED_ACTION: ${KEYCLOAK_SECURITY_REQUIRED_ACTION:-CONFIGURE_TOTP}
      KEYCLOAK_SECURITY_REMEMBER_ME: ${KEYCLOAK_SECURITY_REMEMBER_ME:-true}
      KEYCLOAK_SECURITY_SSO_IDLE: ${KEYCLOAK_SECURITY_SSO_IDLE:-PT30M}
      KEYCLOAK_SECURITY_SSO_MAX: ${KEYCLOAK_SECURITY_SSO_MAX:-PT8H}
      KEYCLOAK_SECURITY_ACCESS_TOKEN_LIFESPAN: ${KEYCLOAK_SECURITY_ACCESS_TOKEN_LIFESPAN:-PT5M}
      KEYCLOAK_SECURITY_CLIENT_SESSION_IDLE: ${KEYCLOAK_SECURITY_CLIENT_SESSION_IDLE:-PT30M}
      KEYCLOAK_SECURITY_CLIENT_SESSION_MAX: ${KEYCLOAK_SECURITY_CLIENT_SESSION_MAX:-PT8H}
      KEYCLOAK_SECURITY_RECONCILE_CRON: ${KEYCLOAK_SECURITY_RECONCILE_CRON:-0 0 */6 * * *}
      APP_OBSERVABILITY_ENABLED: ${APP_OBSERVABILITY_ENABLED:-true}
      APP_OBSERVABILITY_OPENSEARCH_BASE_URL: ${APP_OBSERVABILITY_OPENSEARCH_BASE_URL:-http://nrs-opensearch:9200}
      APP_OBSERVABILITY_TEMPO_BASE_URL: ${APP_OBSERVABILITY_TEMPO_BASE_URL:-http://nrs-tempo:3200}
      APP_OBSERVABILITY_GRAFANA_PUBLIC_BASE_URL: ${APP_OBSERVABILITY_GRAFANA_PUBLIC_BASE_URL:-http://localhost:3001}
      APP_OBSERVABILITY_GRAFANA_TEMPO_UID: ${APP_OBSERVABILITY_GRAFANA_TEMPO_UID:-nrs-tempo}
      NRS_RECEIPT_STORAGE_ROOT: ${NRS_RECEIPT_STORAGE_ROOT:-/data/receipts}
      # Portföy AI analizi — kök .env (gitignore)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TEMPERATURE: ${OPENAI_TEMPERATURE:-0.2}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      PORTFOLIO_AI_DAILY_LIMIT: ${PORTFOLIO_AI_DAILY_LIMIT:-0}
    volumes:
      - finance_receipts_data:/data/receipts
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  log-consumer-service:
    build: ./log-consumer-service
    container_name: nrs-log-consumer
    ports:
      - "8087:8087"
    depends_on:
      - kafka
      - redis
      - opensearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
      OPENSEARCH_HOST: nrs-opensearch
      OPENSEARCH_PORT: "9200"
      KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  notification-service:
    build: ./notification-service
    container_name: nrs-notification
    ports:
      - "8089:8089"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8089/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://nrs-postgres:5432/nrs_finance?currentSchema=public
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
      KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN}
      GMAIL_FROM_ADDRESS: ${GMAIL_FROM_ADDRESS}
      NOTIFICATION_TEST_EMAIL: ${NOTIFICATION_TEST_EMAIL}
      KEYCLOAK_NOTIFICATION_S2S_SECRET: ${KEYCLOAK_NOTIFICATION_S2S_SECRET}
      FINANCE_BASE_URL: ${FINANCE_BASE_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # Vite geliştirme sunucusu (HMR, kaynak klasör bind mount). Üretim nginx imajı compose’ta yok; dağıtım için frontend/Dockerfile kullanılır.
  # Host 3000 → konteyner 5173: tarayıcı `http://localhost:3000` ile Keycloak redirect_uri (genelde 3000) ile aynı kök olur.
  # 3000 başka süreçte kullanılıyorsa (eski nginx nrs-frontend vb.) önce durdur veya bu mapping’i çakışmayacak porta çek.
  # API çağrıları tarayıcıdan gider; VITE_* host’tan erişilebilir olmalı (örn. localhost:8085).
  frontend-dev:
    image: node:22-alpine
    working_dir: /app
    container_name: nrs-frontend-dev
    ports:
      - "3000:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      npm_config_update_notifier: "false"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8085}
      VITE_MARKET_API_URL: ${VITE_MARKET_API_URL:-http://localhost:8083}
      VITE_NOTIFICATION_API_URL: ${VITE_NOTIFICATION_API_URL:-http://localhost:8089}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-nrs-finance}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-nrs-frontend}
      VITE_GRAFANA_SOLO_BASE: ${VITE_GRAFANA_SOLO_BASE:-http://localhost:3001/d-solo/nrs-observability/nrs-observability}
      VITE_GRAFANA_ORG_ID: ${VITE_GRAFANA_ORG_ID:-1}
      VITE_GRAFANA_AUDIT_PANEL_REQUEST_VOLUME: ${VITE_GRAFANA_AUDIT_PANEL_REQUEST_VOLUME:-1}
      VITE_GRAFANA_AUDIT_PANEL_ERROR_RATE: ${VITE_GRAFANA_AUDIT_PANEL_ERROR_RATE:-2}
      VITE_GRAFANA_AUDIT_PANEL_P95_RESPONSE: ${VITE_GRAFANA_AUDIT_PANEL_P95_RESPONSE:-}
      VITE_GRAFANA_AUDIT_PANEL_SERVICE_HEALTH: ${VITE_GRAFANA_AUDIT_PANEL_SERVICE_HEALTH:-4}
      VITE_GRAFANA_AUDIT_PANEL_TEMPO_SPAN_RATE: ${VITE_GRAFANA_AUDIT_PANEL_TEMPO_SPAN_RATE:-}
      VITE_GRAFANA_AUDIT_PANEL_TEMPO_NODE_GRAPH: ${VITE_GRAFANA_AUDIT_PANEL_TEMPO_NODE_GRAPH:-}
      VITE_GRAFANA_TEMPO_EXPLORE_DRILLDOWN_URL: ${VITE_GRAFANA_TEMPO_EXPLORE_DRILLDOWN_URL:-}
      VITE_GRAFANA_TEMPO_EXPLORE_NODE_GRAPH_URL: ${VITE_GRAFANA_TEMPO_EXPLORE_NODE_GRAPH_URL:-}
      VITE_GRAFANA_SERVICE_MAP_TRACE_URL_TEMPLATE: ${VITE_GRAFANA_SERVICE_MAP_TRACE_URL_TEMPLATE:-}
    volumes:
      - ./frontend:/app
      - frontend_dev_node_modules:/app/node_modules
    command: [ "sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0 --port 5173" ]
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: nrs-opensearch
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: nrs-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://nrs-opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    depends_on:
      opensearch:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  postgres_data:
  keycloak_data:
  redis_data:
  opensearch_data:
  finance_receipts_data:
  frontend_dev_node_modules:
