services:

  postgres:
    image: postgres:16
    container_name: nrs-postgres
    environment:
      POSTGRES_DB: nrs_finance
      POSTGRES_USER: nrs
      POSTGRES_PASSWORD: nrs123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: nrs-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: nrs-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@nrs-kafka:9094
      KAFKA_CLUSTER_ID: qac-tlqtSv-W6pq3f_0BTg
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://nrs-kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  redis:
    image: redis:7.2-alpine
    container_name: nrs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  log-consumer-service:
    build: ./log-consumer-service
    container_name: nrs-log-consumer
    depends_on:
      - kafka
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: docker

  whale-analytics-service:
    build: ./whale-analytics-service
    container_name: nrs-whale-analytics
    depends_on:
      - kafka
      - redis
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker

volumes:
  postgres_data:
  keycloak_data:
  redis_data:
