services:
  postgres:
    image: postgres:16
    container_name: nrs-postgres
    environment:
      POSTGRES_DB: nrs_finance
      POSTGRES_USER: nrs
      POSTGRES_PASSWORD: nrs123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrs -d nrs_finance"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: nrs-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080" # Dışarıdan 8081 ile erişilir, içeride 8080 çalışır
    volumes:
      - keycloak_data:/opt/keycloak/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: nrs-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@nrs-kafka:9094
      KAFKA_CLUSTER_ID: qac-tlqtSv-W6pq3f_0BTg
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://nrs-kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # 🔥 YENİ EKLENEN
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    command:
      - sh
      - -c
      - "sed -i '/KAFKA_CLUSTER_ID/d' /etc/confluent/docker/run && CLUSTER_ID=qac-tlqtSv-W6pq3f_0BTg /etc/confluent/docker/run"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7.2-alpine
    container_name: nrs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  market-data-service:
    build: ./marketdata
    container_name: nrs-market-data
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://nrs-postgres:5432/nrs_market
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
      SPRING_DATA_REDIS_HOST: nrs-redis
      KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
      FINHUB_API_KEY: "d69m8shr01qhe6mo0t1gd69m8shr01qhe6mo0t20"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  finance-service:
    build: ./finance-service
    container_name: nrs-finance
    ports:
      - "8085:8080"
    depends_on:
      - postgres
      - kafka
      - redis
      - market-data-service
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://nrs-postgres:5432/nrs_finance
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
      SPRING_DATA_REDIS_HOST: nrs-redis
      MARKET_DATA_SERVICE_URL: http://nrs-market-data:8083
      KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  whale-analytics-service:
    build: ./whale-analytics-service
    container_name: nrs-whale-analytics
    ports:
      - "8082:8082"
    depends_on:
      - kafka
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
      SPRING_DATA_REDIS_HOST: nrs-redis
      KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  log-consumer-service:
    build: ./log-consumer-service
    container_name: nrs-log-consumer
    ports:
      - "8087:8087"
    depends_on:
      - kafka
      - redis
      - opensearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8087/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
      OPENSEARCH_HOST: nrs-opensearch
      OPENSEARCH_PORT: "9200"
      KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  metrics-service:
    build: ./metrics-service
    container_name: nrs-metrics
    ports:
      - "8088:8088"
    depends_on:
      - kafka
      - redis
      - opensearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
      SPRING_DATA_REDIS_HOST: nrs-redis
      OPENSEARCH_HOST: nrs-opensearch
      OPENSEARCH_PORT: 9200
      KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8085
        VITE_MARKET_API_URL: http://localhost:8083
        VITE_KEYCLOAK_URL: http://localhost:8081
        VITE_KEYCLOAK_REALM: nrs-finance
        VITE_KEYCLOAK_CLIENT_ID: nrs-finance-backend
    container_name: nrs-frontend
    ports:
      - "3000:80"
    depends_on:
      - finance-service
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: nrs-opensearch
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    container_name: nrs-opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - 'OPENSEARCH_HOSTS=["http://nrs-opensearch:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    depends_on:
      opensearch:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  postgres_data:
  keycloak_data:
  redis_data:
  opensearch_data:
