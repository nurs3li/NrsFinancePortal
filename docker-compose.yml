services:
  postgres:
    image: postgres:16
    container_name: nrs-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: nrs-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8081:8080" 
    volumes:
      - keycloak_data:/opt/keycloak/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: nrs-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@nrs-kafka:9094
      KAFKA_CLUSTER_ID: qac-tlqtSv-W6pq3f_0BTg
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://nrs-kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 268435456
    command:
      - sh
      - -c
      - "sed -i '/KAFKA_CLUSTER_ID/d' /etc/confluent/docker/run && CLUSTER_ID=qac-tlqtSv-W6pq3f_0BTg /etc/confluent/docker/run"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7.2-alpine
    container_name: nrs-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: nrs-otel-collector
    restart: unless-stopped
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (Spring Boot servisleri buraya trace gönderiyor)
      - "8889:8889"   # Prometheus metrik endpoint (Grafana için)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    container_name: nrs-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:latest
    container_name: nrs-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Local dev: Audit Logs iframe'leri şifresiz açılır (tek admin, :3001). Üretimde kapatın.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tempo:
    image: grafana/tempo:2.10.2
    container_name: nrs-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    depends_on:
      - prometheus
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"   # Tempo HTTP API (Grafana datasource buraya)
      - "4319:4319"   # OTLP gRPC (istersen direkt Tempo'ya da gönderirsin)
      - "4320:4320"   # OTLP HTTP (tempo.yaml'da http açtıysan)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  market-data-service:
    build: ./marketdata
    container_name: nrs-market-data
    volumes:
      # CSV'ler zaten repo içinde artifacts/viop altında; konteynerde /app/artifacts/viop olur (VIOP_BACKFILL_DIR=artifacts/viop).
      - ./artifacts:/app/artifacts:ro
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    environment:
      TZ: Europe/Istanbul
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://nrs-postgres:5432/nrs_market
      SPRING_KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
      SPRING_DATA_REDIS_HOST: nrs-redis
      KAFKA_BOOTSTRAP_SERVERS: nrs-kafka:9093
      FINHUB_API_KEY: ${FINHUB_API_KEY}
      ETF_HISTORY_INCREMENTAL_CRON: ${ETF_HISTORY_INCREMENTAL_CRON:-0 45 6 * * *}
      ETF_HISTORY_INCREMENTAL_DAYS: ${ETF_HISTORY_INCREMENTAL_DAYS:-30}
      STOOQ_BASE_URL: ${STOOQ_BASE_URL:-https://stooq.com}
      STOOQ_API_KEY: ${STOOQ_API_KEY:-}
      YAHOO_BASE_URL: ${YAHOO_BASE_URL:-https://query1.finance.yahoo.com}
      EQUITY_HISTORY_INCREMENTAL_CRON: ${EQUITY_HISTORY_INCREMENTAL_CRON:-0 30 2 * * *}
      EQUITY_HISTORY_INCREMENTAL_ZONE: ${EQUITY_HISTORY_INCREMENTAL_ZONE:-Europe/Istanbul}
      EQUITY_INITIAL_SEED_ENABLED: ${EQUITY_INITIAL_SEED_ENABLED:-true}
      EQUITY_INITIAL_SEED_MIN_CANDLES: ${EQUITY_INITIAL_SEED_MIN_CANDLES:-120}
      EQUITY_INITIAL_SEED_STALE_DAYS: ${EQUITY_INITIAL_SEED_STALE_DAYS:-4}
      EQUITY_INCREMENTAL_GAP_HEAL_DAYS: ${EQUITY_INCREMENTAL_GAP_HEAL_DAYS:-21}
      EQUITY_MAX_HISTORY_DAYS: ${EQUITY_MAX_HISTORY_DAYS:-730}
      EQUITY_HISTORY_BACKFILL_ENABLED: ${EQUITY_HISTORY_BACKFILL_ENABLED:-false}
      EQUITY_HISTORY_BACKFILL_PERIOD_DAYS: ${EQUITY_HISTORY_BACKFILL_PERIOD_DAYS:-730}
      EQUITY_HISTORY_BACKFILL_BATCH_SIZE: ${EQUITY_HISTORY_BACKFILL_BATCH_SIZE:-20}
      EQUITY_HISTORY_BACKFILL_SHUTDOWN_ON_COMPLETE: ${EQUITY_HISTORY_BACKFILL_SHUTDOWN_ON_COMPLETE:-false}
      APP_EQUITY_HISTORY_BACKFILL_ENABLED: ${EQUITY_HISTORY_BACKFILL_ENABLED:-false}
      APP_EQUITY_HISTORY_BACKFILL_PERIOD_DAYS: ${EQUITY_HISTORY_BACKFILL_PERIOD_DAYS:-730}
      APP_EQUITY_HISTORY_BACKFILL_BATCH_SIZE: ${EQUITY_HISTORY_BACKFILL_BATCH_SIZE:-20}
